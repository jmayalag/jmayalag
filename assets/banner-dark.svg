<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Jordan Ayala, Forward Deployed AI Engineer</title>
  <desc id="desc">Banner with a chrome J monogram on a frosted glass card over a soft gradient.</desc>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="frame"><rect width="1280" height="320" rx="28"/></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06999999999999999"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <style>
    .drift-a { animation: a 18s ease-in-out infinite alternate; }
    .drift-b { animation: b 22s ease-in-out infinite alternate; }
    .drift-c { animation: c 26s ease-in-out infinite alternate; }
    @keyframes a { to { transform: translate(140px, 40px); } }
    @keyframes b { to { transform: translate(-160px, -30px); } }
    @keyframes c { to { transform: translate(90px, -50px); } }
    @media (prefers-reduced-motion: reduce) { .drift-a, .drift-b, .drift-c { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#0a0908"/>
    <g filter="url(#blur)" opacity="0.9">
      <circle class="drift-a" cx="980" cy="60" r="190" fill="#2a1f1a"/>
      <circle class="drift-b" cx="1180" cy="280" r="170" fill="#3a2a22"/>
      <circle class="drift-c" cx="260" cy="300" r="200" fill="#4a362c"/>
      <circle class="drift-a" cx="620" cy="-20" r="150" fill="#1a1411"/>
    </g>

    <!-- glass card -->
    <rect x="48" y="44" width="1184" height="232" rx="24" fill="url(#sheen)"/>
    <rect x="48.5" y="44.5" width="1183" height="231" rx="23.5" fill="none" stroke="url(#rim)"/>

    <!-- monogram tile -->
    <rect x="88" y="84" width="152" height="152" rx="32" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="88.5" y="84.5" width="151" height="151" rx="31.5" fill="none" stroke="url(#rim)"/>
    <image x="108" y="104" width="112" height="112" href="data:image/webp;base64,"/>

    <g font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="280" y="116" font-size="15" font-weight="600" letter-spacing="2.4" fill="#98989d">HELLO, I'M</text>
      <text x="277" y="172" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">Jordan Ayala</text>
      <text x="280" y="212" font-size="24" font-weight="600" fill="#2997ff">Forward Deployed AI Engineer</text>
      <text x="280" y="246" font-size="21" font-weight="400" fill="#d2d2d7">I build agentic systems and ship them to production.</text>
      <text x="1192" y="116" text-anchor="end" font-size="15" font-weight="600" letter-spacing="0.4" fill="#98989d">jordanbuilds.io ↗</text>
    </g>
  </g>
</svg>
